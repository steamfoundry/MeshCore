; Notes for PlatformIO usage so I can find them later
;pio run -t upload -e QTPy_ESP32S2_WIO_repeater
;pio device monitor -e QTPy_ESP32S2_WIO_repeater
[QTPy_ESP32S2_WIO]
extends = esp32_base
board = adafruit_qtpy_esp32s2
board_build.mcu = esp32s2
board_build.filesystem = spiffs
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/qtpy_esp32s2_wio
  -D QTPY_ESP32S2_WIO
  -UENV_INCLUDE_GPS
  -D USE_SX1262
  -D ESP32_CPU_FREQ=80
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=17
  -D P_LORA_RESET=9
  -D P_LORA_BUSY=8
  -D P_LORA_NSS=7
  -D P_LORA_RF_SWITCH=6
  -D P_LORA_MOSI=35
  -D P_LORA_MISO=37
  -D P_LORA_SCLK=36
  -D NEOPIXEL_POWER=38
  -D NEOPIXEL_LED=39
  -D PIN_USER_BTN=18
  -D PIN_BOARD_SDA=41
  -D PIN_BOARD_SCL=40
  -D SX126X_DIO2_AS_RF_SWITCH=false
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=20
  -D MAX_LORA_TX_POWER=22
  -D RADIOLIB_EXCLUDE_SX127X=1
build_src_filter =
  ${esp32_base.build_src_filter}
  +<../variants/qtpy_esp32s2_wio/*.cpp>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[env:QTPy_ESP32S2_WIO_repeater]
extends = QTPy_ESP32S2_WIO
build_flags =
  ${QTPy_ESP32S2_WIO.build_flags}
  -D ADVERT_NAME='"QTPy S2 Relay"'
  -D BUILD_ENV_NAME='"QTPy_ESP32S2_WIO_repeater"'
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -g3
  -ggdb
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"H3ar_Me"'
  -D MAX_NEIGHBOURS=50
build_src_filter =
  ${QTPy_ESP32S2_WIO.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${QTPy_ESP32S2_WIO.lib_deps}
  ${esp32_ota.lib_deps}

[env:QTPy_ESP32S2_WIO_repeater_bridge_espnow]
extends = QTPy_ESP32S2_WIO
build_flags =
  ${QTPy_ESP32S2_WIO.build_flags}
  -D ADVERT_NAME='"QTPy S2 ESP-NOW Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_ESPNOW_BRIDGE=1
build_src_filter =
  ${QTPy_ESP32S2_WIO.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${QTPy_ESP32S2_WIO.lib_deps}
  ${esp32_ota.lib_deps}

[env:QTPy_ESP32S2_WIO_room_server]
extends = QTPy_ESP32S2_WIO
build_flags =
  ${QTPy_ESP32S2_WIO.build_flags}
  -D ADVERT_NAME='"QTPy S2 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter =
  ${QTPy_ESP32S2_WIO.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
lib_deps =
  ${QTPy_ESP32S2_WIO.lib_deps}
  ${esp32_ota.lib_deps}

[env:QTPy_ESP32S2_WIO_terminal_chat]
extends = QTPy_ESP32S2_WIO
build_flags =
  ${QTPy_ESP32S2_WIO.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
build_src_filter =
  ${QTPy_ESP32S2_WIO.build_src_filter}
  +<../examples/simple_secure_chat/main.cpp>
lib_deps =
  ${QTPy_ESP32S2_WIO.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:QTPy_ESP32S2_WIO_companion_radio_usb]
extends = QTPy_ESP32S2_WIO
build_flags =
  ${QTPy_ESP32S2_WIO.build_flags}
  -D MAX_CONTACTS=32
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=16
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ENABLE_USB_INTERFACE
build_src_filter =
  ${QTPy_ESP32S2_WIO.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${QTPy_ESP32S2_WIO.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:QTPy_ESP32S2_WIO_companion_radio_wifi]
extends = QTPy_ESP32S2_WIO
build_flags =
  ${QTPy_ESP32S2_WIO.build_flags}
  -D ENABLE_WIFI_INTERFACE
  -D MAX_CONTACTS=32
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=16
build_src_filter =
  ${QTPy_ESP32S2_WIO.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/SerialBLEInterface.cpp>
  +<helpers/wifi/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${QTPy_ESP32S2_WIO.lib_deps}
  densaugeo/base64 @ ~1.4.0

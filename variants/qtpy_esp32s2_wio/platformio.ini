[QTPy_ESP32S2_WIO]
extends = esp32_base
board = adafruit_qtpy_esp32s2
board_build.mcu = esp32s2
board_build.filesystem = spiffs
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/qtpy_esp32s2_wio
  -D QTPY_ESP32S2_WIO
  -UENV_INCLUDE_GPS
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=17
  -D P_LORA_RESET=9
  -D P_LORA_BUSY=8
  -D P_LORA_NSS=7
  -D P_LORA_RF_SWITCH=6
  -D P_LORA_TXEN=5
  -D P_LORA_RXEN=16
  -D P_LORA_MOSI=35
  -D P_LORA_MISO=37
  -D P_LORA_SCLK=36
  -D PIN_USER_BTN=0
  -D SX126X_DIO2_AS_RF_SWITCH=false
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=20
  -D MAX_LORA_TX_POWER=22
  -D RADIOLIB_EXCLUDE_SX127X=1
build_src_filter =
  ${esp32_base.build_src_filter}
  +<../variants/qtpy_esp32s2_wio/*.cpp>
  +<helpers/sensors>

lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[env:QTPy_ESP32S2_WIO_repeater]
extends = QTPy_ESP32S2_WIO
build_flags =
  ${QTPy_ESP32S2_WIO.build_flags}
  -D ADVERT_NAME='"QTPy S2 Relay"'
  -D BUILD_ENV_NAME='"QTPy_ESP32S2_WIO_repeater"'
build_src_filter =
  ${QTPy_ESP32S2_WIO.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
